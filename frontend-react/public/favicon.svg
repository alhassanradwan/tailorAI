<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
  </defs>
  
  <!-- Neural network nodes -->
  <circle cx="32" cy="12" r="4" fill="url(#brainGradient)"/>
  <circle cx="16" cy="24" r="4" fill="url(#brainGradient)"/>
  <circle cx="48" cy="24" r="4" fill="url(#brainGradient)"/>
  <circle cx="10" cy="40" r="4" fill="url(#brainGradient)"/>
  <circle cx="32" cy="40" r="4" fill="url(#brainGradient)"/>
  <circle cx="54" cy="40" r="4" fill="url(#brainGradient)"/>
  <circle cx="22" cy="54" r="4" fill="url(#brainGradient)"/>
  <circle cx="42" cy="54" r="4" fill="url(#brainGradient)"/>
  
  <!-- Connections -->
  <line x1="32" y1="12" x2="16" y2="24" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="12" x2="48" y2="24" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="16" y1="24" x2="10" y2="40" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="16" y1="24" x2="32" y2="40" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="24" x2="32" y2="40" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="24" x2="54" y2="40" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="10" y1="40" x2="22" y2="54" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="40" x2="22" y2="54" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="40" x2="42" y2="54" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="54" y1="40" x2="42" y2="54" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
</svg>
